<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="input.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="bg-background py-10 h-screen flex items-center justify-center">
      <div class="bg-white rounded-[20px] w-100 py-10 px-10">
        <div class="flex flex-col gap-7">
          <div class="flex flex-col justify-center items-center gap-2.5">
            <p class="text-3xl text-black font-medium">Welcome back</p>
            <p class="text-[15px] font-medium text-gray-600">
              Sign in to your account to continue
            </p>
          </div>
          <p>Transfer</p>

          <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Email address</label
                >
                <p class="text-red-600 noEmail hidden">*</p>
              </div>
              <input
                class="bg-background auth-input py-1.5 px-2.5 rounded-[5px] border border-border signIn-email-input"
              />
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Password</label
                >
                <p class="text-red-600 noPsw hidden">*</p>
              </div>
              <div class="relative password-field">
                <input
                  type="password"
                  class="bg-background w-full auth-input py-1.5 px-2.5 rounded-[5px] border border-border signIn-psw-input"
                />
                <button
                  class="eye-open absolute right-3 top-1/2 -translate-y-1/2 hidden"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
                <button
                  class="eye-closed absolute right-3 top-1/2 -translate-y-1/2"
                >
                  <i class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
              <p class="text-red-600 font-semibold invalid-credintials hidden">
                Invalid credintials! Please try again.
              </p>
            </div>
          </div>
          <button
            class="bg-brick-primary hover:bg-brick-deep text-white border border-gray-300 rounded-[7px] py-1.5 px-2.5 font-medium cursor-pointer sign-in-button"
          >
            Sign in
          </button>
          <div
            class="flex gap-1 items-center justify-center border-t border-t-gray-300 pt-3"
          >
            <p class="text-gray-600 text-[14px]">No account?</p>
            <a href="create-account.html">
              <p
                class="text-brick-primary font-medium cursor-pointer text-[14px]"
              >
                Create one
              </p>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="signInAccount.js"></script>
  </body>
</html>
