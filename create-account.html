<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="input.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="bg-background py-10 h-screen flex items-center justify-center">
      <div class="bg-white rounded-[20px] w-100 py-7 px-10">
        <div class="flex flex-col gap-4">
          <div class="flex flex-col justify-center items-center">
            <p class="text-3xl text-black font-medium">Create account</p>
            <p class="text-[15px] font-medium text-gray-600">Get started</p>
          </div>
          <div class="flex flex-col gap-5">
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >First name</label
                >
                <p class="text-red-600 noName hidden">*</p>
              </div>
              <input
                class="bg-background auth-input py-1.5 px-2.5 rounded-[5px] border border-gray-300 firstname-input input"
              />
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Last name</label
                >
                <p class="text-red-600 noLname hidden">*</p>
              </div>
              <input
                class="bg-background auth-input py-1.5 px-2.5 rounded-[5px] border border-gray-300 lastname-input input"
              />
            </div>

            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Email address</label
                >
                <p class="text-red-600 noEmail hidden">*</p>
              </div>
              <input
                class="bg-background auth-input py-1.5 px-2.5 rounded-[5px] border border-border email-address-input input"
              />
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Password</label
                >
                <p class="text-red-600 noPsw hidden">*</p>
              </div>
              <div class="relative password-field">
                <input
                  type="password"
                  class="bg-background w-full auth-input py-1.5 px-2.5 rounded-[5px] border border-border password-input"
                />
                <button
                  class="eye-open absolute right-3 top-1/2 -translate-y-1/2 hidden"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
                <button
                  class="eye-closed absolute right-3 top-1/2 -translate-y-1/2"
                >
                  <i class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
            </div>
            <div class="flex flex-col gap-1">
              <div class="flex justify-between">
                <label class="text-[15px] font-medium text-gray-600"
                  >Confirm password</label
                >
                <p class="text-red-600 noConfirmPsw hidden">*</p>
              </div>
              <div class="relative password-field">
                <input
                  type="password"
                  class="bg-background w-full auth-input py-1.5 px-2.5 rounded-[5px] border border-gray-300 confirm-password-input"
                />
                <button
                  class="eye-open absolute right-3 top-1/2 -translate-y-1/2 hidden"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
                <button
                  class="eye-closed absolute right-3 top-1/2 -translate-y-1/2"
                >
                  <i class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
              <p class="text-red-600 font-semibold hidden psw-error">
                Passwords do not match. Please try again.
              </p>
            </div>

            <div
              class="bg-pink-50 p-1.5 email-exists-error hidden rounded-sm border border-red-600 input text-center"
            >
              <p class="text-red-600">This email already exists!</p>
            </div>
          </div>
          <button
            class="bg-brick-primary hover:bg-brick-deep text-white border rounded-[7px] py-1.5 px-2.5 font-medium cursor-pointer create-account-button"
          >
            Create account
          </button>
          <div
            class="flex gap-1 items-center justify-center border-t border-t-gray-300 pt-3"
          >
            <p class="text-gray-600 text-[14px]">Already have an account?</p>
            <a href="sign-in-account.html">
              <p
                class="text-brick-primary font-medium cursor-pointer text-[14px] sign-in-text"
              >
                Sign in
              </p>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="createAccount.js"></script>
  </body>
</html>
